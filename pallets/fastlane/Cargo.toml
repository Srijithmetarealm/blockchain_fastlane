[package]
name = "pallet-fastlane"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }
codec = { workspace = true }
scale-info = { workspace = true }
sp-core        = { workspace = true }
sp-runtime     = { workspace = true }
log            = { version = "0.4", default-features = false }

[dev-dependencies]
sp-keyring = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
# Real BLS (BLS12-381) for the §14 signature-aggregation proof. Test-only:
# this does NOT enter the runtime/WASM build, so the live chain is unaffected.
w3f-bls = { version = "0.1.9", default-features = true }
rand = { version = "0.8", default-features = true }


[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "sp-std/std",
    "sp-io/std",
    "codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
]